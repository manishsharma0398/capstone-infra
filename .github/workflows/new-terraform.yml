name: Terraform (Terragrunt)

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
  workflow_dispatch: # optional, only if you want to run it manually

jobs:
  plan-stg:
    runs-on: ubuntu-latest
    environment: stg
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Terraform Plan (stg)
        run: terragrunt run-all plan --non-interactive
        working-directory: ./stg
        env:
          TF_INPUT: 0
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  plan-prd:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment: prd
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Terraform Plan (prd)
        run: terragrunt run-all plan --non-interactive
        working-directory: ./prd
        env:
          TF_INPUT: 0
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
