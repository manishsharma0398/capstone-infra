name: Terraform (Terragrunt)

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
  workflow_dispatch: # optional, only if you want to run it manually

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [stg, prd]
    if: ${{ matrix.env != 'prd' || github.ref == 'refs/heads/master' }}
    environment: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Terraform Plan (${{ matrix.env }})
        run: |
          terragrunt run-all plan --non-interactive
        working-directory: ./${{ matrix.env }}
        env:
          TF_INPUT: 0
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  apply:
    runs-on: ubuntu-latest
    needs: plan
    strategy:
      matrix:
        env: [stg, prd]
    if: ${{ matrix.env != 'prd' || github.ref == 'refs/heads/master' }}
    environment: ${{ matrix.env }} # <-- requires approval per env
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Terraform Apply (${{ matrix.env }})
        run: |
          terragrunt run-all apply --non-interactive --auto-approve
        working-directory: ./${{ matrix.env }}
        env:
          TF_INPUT: 0
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
