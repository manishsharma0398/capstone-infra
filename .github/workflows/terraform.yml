name: Terraform (Terragrunt)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: Environment to deploy to (stg/prd)
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        description: Environment to deploy to
        options:
          - stg
          - prd

jobs:
  plan:
    runs-on: ubuntu-latest
    if: ${{ inputs.environment != 'prd' || github.ref == 'refs/heads/master' }}
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Terragrunt Plan (${{ inputs.environment }})
        run: terragrunt run-all plan --non-interactive
        working-directory: ./live/${{ inputs.environment }}
        env:
          TF_INPUT: 0
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  apply:
    runs-on: ubuntu-latest
    if: ${{ inputs.environment != 'prd' || github.ref == 'refs/heads/master' }}
    needs: plan
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Terragrunt Apply (${{ inputs.environment }})
        run: terragrunt run-all apply --non-interactive --auto-approve
        working-directory: ./live/${{ inputs.environment }}
        env:
          TF_INPUT: 0
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
