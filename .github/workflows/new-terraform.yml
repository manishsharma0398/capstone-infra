name: Terraform (Terragrunt)

on:
  workflow_dispatch: # allow manual trigger
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, stg, tst, prd] # multiple environments
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Terraform Plan (${{ matrix.env }})
        run: |
          terragrunt run-all plan --non-interactive -out=tfplan-${{ matrix.env }}
        working-directory: ./environments/${{ matrix.env }}
        env:
          TF_INPUT: 0
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_${{ upper(matrix.env) }} }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_${{ upper(matrix.env) }} }}

  apply:
    runs-on: ubuntu-latest
    needs: plan
    strategy:
      matrix:
        env: [dev, stg, tst, prd]
    environment: ${{ matrix.env }} # <-- requires approval per env
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Terraform Apply (${{ matrix.env }})
        run: |
          terragrunt run-all apply --non-interactive --auto-approve
        working-directory: ./environments/${{ matrix.env }}
        env:
          TF_INPUT: 0
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_${{ upper(matrix.env) }} }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_${{ upper(matrix.env) }} }}
